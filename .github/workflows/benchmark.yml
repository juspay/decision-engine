name: benchmark

# Latency and throughput of /decide, /routing/hybrid, /decide-gateway and /routing/evaluate on a
# GitHub-hosted Linux runner. Run by hand; the report lands in the job summary and as an artifact.
#
# The server is pinned to two cores (the pod size docs/benchmarks.mdx sizes against) and the
# datastores and k6 share the rest, so the server's cores carry nothing but the server. Hosted
# runners are shared machines: compare numbers from the same run, not across runs.
on:
  workflow_dispatch:
    inputs:
      ref_note:
        description: "Free-text note printed at the top of the report"
        required: false
        default: ""
      lat_rate:
        description: "Arrival rate (req/s) for the latency phase"
        default: "200"
      lat_duration:
        description: "Length of each latency run"
        default: "60s"
      rounds:
        description: "Latency rounds per endpoint"
        default: "3"
      tps_rates:
        description: "Comma-separated arrival rates (req/s) for the throughput phase"
        default: "200,400,800,1200,1600,2000"
      tps_duration:
        description: "Length of each throughput step"
        default: "30s"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  STABLE_RUST_TOOLCHAIN: "1.99.1"
  K6_VERSION: "v1.0.0"
  SERVER_CPUS: "0,1"
  OTHER_CPUS: "2,3"

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.STABLE_RUST_TOOLCHAIN }}

      - name: Install native deps for rdkafka
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libcurl4-openssl-dev libsasl2-dev zlib1g-dev libpq-dev

      - uses: Swatinem/rust-cache@v2.7.7
        with:
          key: release-fast

      - uses: taiki-e/install-action@v2
        with:
          tool: just
          checksum: true

      - name: Install diesel CLI
        run: cargo install diesel_cli --no-default-features --features postgres --locked

      - name: Install k6
        run: |
          curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
          k6 version

      - name: Build decision-engine (release-fast, PostgreSQL)
        run: cargo build --profile release-fast --no-default-features --features middleware,postgres

      - name: Start datastores
        run: |
          COMPOSE_PROFILES= docker compose --profile postgres-ghcr --profile analytics-clickhouse \
            up -d postgresql redis kafka kafka-init clickhouse mailpit
          COMPOSE_PROFILES= docker compose --profile postgres-ghcr --profile analytics-clickhouse \
            up -d --wait postgresql redis kafka clickhouse mailpit
          # Keep the datastores off the server's cores.
          docker update --cpuset-cpus "$OTHER_CPUS" $(docker ps -q)

      - name: Apply database schema
        run: just migrate-pg

      - name: Seed global service configs
        run: |
          COMPOSE_PROFILES= docker compose --profile postgres-ghcr exec -T postgresql \
            psql -v ON_ERROR_STOP=1 -U db_user -d decision_engine_db -c "
              INSERT INTO service_configuration (name, value)
              SELECT v.name, v.value
              FROM (VALUES
                  ('ENABLE_MERCHANT_ON_VOLUME_DISTRIBUTION_FEATURE_SR_V3', '{\"enableAll\":true,\"enableAllRollout\":100}'),
                  ('merchants_enabled_for_score_keys_unification',         '{\"enableAll\":true,\"enableAllRollout\":100}'),
                  ('SR_V3_INPUT_CONFIG_DEFAULT',                           '{\"defaultLatencyThreshold\":90,\"defaultBucketSize\":125,\"defaultHedgingPercent\":5}')
              ) AS v(name, value)
              WHERE NOT EXISTS (
                  SELECT 1 FROM service_configuration sc WHERE sc.name = v.name
              );"

      - name: Start decision-engine on two pinned cores
        env:
          DECISION_ENGINE__LOG__CONSOLE__LEVEL: INFO
        run: |
          taskset -c "$SERVER_CPUS" ./target/release-fast/open_router > server.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/health > /dev/null && exit 0
            sleep 2
          done
          tail -n 100 server.log
          exit 1

      - name: Run benchmark
        env:
          OUT: bench-results
          K6_PREFIX: taskset -c ${{ env.OTHER_CPUS }}
          LAT_RATE: ${{ inputs.lat_rate }}
          LAT_DURATION: ${{ inputs.lat_duration }}
          ROUNDS: ${{ inputs.rounds }}
          TPS_RATES: ${{ inputs.tps_rates }}
          TPS_DURATION: ${{ inputs.tps_duration }}
        run: bash scripts/load-test/ci_benchmark.sh

      - name: Keep the end of the server log
        if: ${{ always() }}
        run: tail -n 5000 server.log > server-tail.log || true

      - name: Write report
        env:
          REF_NOTE: ${{ inputs.ref_note }}
        run: |
          cpu=$(lscpu | sed -n 's/^Model name: *//p')
          note="Commit \`${GITHUB_SHA::8}\` on a GitHub-hosted \`ubuntu-latest\` runner ($(nproc) vCPU, ${cpu}). Server pinned to cores ${SERVER_CPUS}, release-fast build, INFO logs; datastores and k6 on cores ${OTHER_CPUS}. ${REF_NOTE}"
          python3 scripts/load-test/summarize_ci_benchmark.py bench-results "$note" | tee bench-results/report.md
          cat bench-results/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          # The server log runs to hundreds of MB at INFO over a full run; the tail is what explains
          # a failed step.
          path: |
            bench-results/
            server-tail.log
          retention-days: 30
          if-no-files-found: ignore
