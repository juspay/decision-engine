<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Vite substitutes the configured base here, making these absolute. A relative href resolves
         against the current route's directory instead, so deep routes like
         /routing/rules/new would ask for a favicon that is not there. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="shortcut icon" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Juspay Decision Engine Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
