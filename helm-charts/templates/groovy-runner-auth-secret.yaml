{{- if and .Values.groovyRunner.enabled (not .Values.groovyRunner.auth.existingSecret) -}}
{{- $name := include "decision-engine.groovyRunnerAuthSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.groovyRunner.metadata.labels.component }}
type: Opaque
data:
  {{- if and $existing $existing.data (index $existing.data "token") }}
  token: {{ index $existing.data "token" }}
  {{- else }}
  token: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
