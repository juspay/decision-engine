{{- if and .Values.dbMigration.enabled .Values.dbMigration.mysql.enabled .Values.decisionEngine.useMySQL -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "decision-engine.mysqlMigrationName" . }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: mysql-migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "decision-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mysql-migration
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decision-engine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        - name: wait-for-mysql
          image: "{{ .Values.initContainers.busybox.repository }}:{{ .Values.initContainers.busybox.tag }}"
          imagePullPolicy: {{ .Values.initContainers.busybox.pullPolicy }}
          securityContext:
            {{- toYaml .Values.initContainers.securityContext | nindent 12 }}
          command: ['sh', '-c', 'until nc -z {{ include "decision-engine.mysqlHost" . }} 3306; do echo waiting for mysql; sleep 2; done;']
      {{- end }}
      containers:
        - name: migration
          image: "{{ .Values.dbMigration.mysql.image.repository }}:{{ .Values.dbMigration.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.dbMigration.mysql.image.pullPolicy }}
          securityContext:
            {{- include "decision-engine.containerSecurityContext" (dict "global" .Values.securityContext "component" .Values.dbMigration.mysql.securityContext) | nindent 12 }}
          workingDir: /work
          env:
            - name: HOME
              value: /work
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.mysql.auth.rootPassword | quote }}
          command:
            - /bin/sh
            - -c
            - |
              # Download and execute SQL scripts (mysql client and curl ship with the image)
              version={{ .Values.image.version }}
              host={{ include "decision-engine.mysqlHost" . }}
              db_name={{ .Values.mysql.auth.database  }}
              {{- range $url := .Values.dbMigration.mysql.scriptUrls }}
              echo "Downloading {{ $url }}"
              curl -sSL "{{ $url }}" -o /work/init.sql
              if [ -f /work/init.sql ]; then
                mysql --host="$host" -u root -p"$MYSQL_ROOT_PASSWORD" -e "SOURCE /work/init.sql" $db_name
              else
                echo "Error: /work/init.sql not found"
                exit 1
              fi
              {{- end }}
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
{{- end }}
