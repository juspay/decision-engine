{{- if .Values.routingConfig.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "decision-engine.routingConfigName" . }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: routing-config
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "decision-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: routing-config
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decision-engine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        {{- if .Values.decisionEngine.usePostgreSQL }}
        - name: wait-for-postgresql
          image: "{{ .Values.initContainers.busybox.repository }}:{{ .Values.initContainers.busybox.tag }}"
          imagePullPolicy: {{ .Values.initContainers.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ include "decision-engine.postgresqlHost" . }} {{ .Values.postgresql.port }}; do echo waiting for postgresql; sleep 2; done;']
        {{- end }}
        {{- if .Values.decisionEngine.useMySQL }}
        - name: wait-for-mysql
          image: "{{ .Values.initContainers.busybox.repository }}:{{ .Values.initContainers.busybox.tag }}"
          imagePullPolicy: {{ .Values.initContainers.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ include "decision-engine.mysqlHost" . }} {{ .Values.mysql.port }}; do echo waiting for mysql; sleep 2; done;']
        {{- end }}
      {{- end }}
      containers:
        - name: routing-config
          image: "{{ required "routingConfig.image.repository must contain a script to run" .Values.routingConfig.image.repository }}:{{ required "routingConfig.image.tag is required" .Values.routingConfig.image.tag }}"
          imagePullPolicy: {{ .Values.routingConfig.image.pullPolicy }}
          command:
            {{- toYaml .Values.routingConfig.command | nindent 12 }}
          {{- if .Values.routingConfig.configVolume.enabled }}
          volumeMounts:
            - name: routing-config-volume
              mountPath: {{ .Values.routingConfig.configVolume.mountPath }}
          {{- end }}
          env:
            {{- if .Values.decisionEngine.usePostgreSQL }}
            - name: DB_HOST
              value: {{ include "decision-engine.postgresqlHost" . | quote }}
            - name: DB_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: DB_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: DB_TYPE
              value: "postgresql"
            {{- end }}
            {{- if .Values.decisionEngine.useMySQL }}
            - name: DB_HOST
              value: {{ include "decision-engine.mysqlHost" . | quote }}
            - name: DB_PORT
              value: {{ .Values.mysql.port | quote }}
            - name: DB_USER
              value: {{ .Values.mysql.auth.username | default "root" | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.mysql.auth.rootPassword | quote }}
            - name: DB_NAME
              value: {{ .Values.mysql.auth.database | quote }}
            - name: DB_TYPE
              value: "mysql"
            {{- end }}
      {{- if .Values.routingConfig.configVolume.enabled }}
      volumes:
        - name: routing-config-volume
          emptyDir: {}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
