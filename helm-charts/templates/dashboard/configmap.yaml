{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "decision-engine.dashboardName" . }}-nginx
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.dashboard.metadata.labels.component }}
data:
  # Serves the bundle and proxies the API prefix, which the bundle calls on its own origin.
  default.conf: |
    server {
        listen {{ .Values.dashboard.containerPort }};
        server_name _;
        root /usr/share/nginx/html;
        # Path-only redirects; nginx would otherwise use its listen port, not the Ingress one.
        absolute_redirect off;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location {{ .Values.dashboard.apiBasePath | trimSuffix "/" }}/ {
            # The trailing slash strips the prefix.
            proxy_pass http://{{ include "decision-engine.fullname" . }}:{{ (first .Values.service.ports).port }}/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout {{ .Values.dashboard.proxyReadTimeout }};
        }

        # SPA fallback for client-side routes.
        location {{ .Values.dashboard.basePath }} {
            try_files $uri $uri/ {{ .Values.dashboard.basePath }}index.html;
        }

        location = / {
            return 302 {{ .Values.dashboard.basePath }};
        }
    }
{{- end }}
