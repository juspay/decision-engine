{{- if .Values.dashboard.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "decision-engine.dashboardName" . }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.dashboard.metadata.labels.component }}
spec:
  type: {{ .Values.dashboard.service.type }}
  ports:
    - name: http
      port: {{ .Values.dashboard.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "decision-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.dashboard.metadata.labels.component }}
{{- end }}
