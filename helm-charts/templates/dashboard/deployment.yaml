{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decision-engine.dashboardName" . }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.dashboard.metadata.labels.component }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "decision-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.dashboard.metadata.labels.component }}
  template:
    metadata:
      annotations:
        # nginx reads the config only at startup.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/dashboard/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "decision-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.dashboard.metadata.labels.component }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decision-engine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Builds the bundle into the shared volume. Needs egress to GitHub and npm.
        - name: build-dashboard
          image: "{{ .Values.dashboard.build.image.repository }}:{{ .Values.dashboard.build.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.build.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |-
              set -e
              MARKER=/usr/share/nginx/html/.dashboard-version
              if [ "$FORCE_BUILD" != "true" ] && [ -f "$MARKER" ] && [ "$(cat $MARKER)" = "$SOURCE_REF" ]; then
                echo "Assets for $SOURCE_REF are already present, skipping the build."
                exit 0
              fi
              echo "Fetching $SOURCE_URL"
              rm -rf /tmp/src && mkdir -p /tmp/src
              wget -qO /tmp/src.tgz "$SOURCE_URL"
              tar -xzf /tmp/src.tgz -C /tmp/src --strip-components=1
              cd /tmp/src/website
              echo "Installing dependencies"
              npm ci --no-audit --no-fund
              echo "Building the dashboard"
              npm run build
              echo "Publishing assets"
              rm -rf /usr/share/nginx/html/* /usr/share/nginx/html/.dashboard-version
              cp -r dist/. /usr/share/nginx/html/
              echo "$SOURCE_REF" > "$MARKER"
              echo "Done"
          env:
            - name: SOURCE_REF
              value: {{ include "decision-engine.dashboardSourceRef" . | quote }}
            - name: SOURCE_URL
              value: {{ include "decision-engine.dashboardSourceUrl" . | quote }}
            - name: FORCE_BUILD
              value: {{ .Values.dashboard.build.forceBuild | quote }}
          resources:
            {{- toYaml .Values.dashboard.build.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      containers:
        - name: dashboard
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.dashboard.nginx.repository }}:{{ .Values.dashboard.nginx.tag }}"
          imagePullPolicy: {{ .Values.dashboard.nginx.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.dashboard.basePath }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "decision-engine.dashboardName" . }}-nginx
        - name: html
          {{- if .Values.dashboard.build.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "decision-engine.dashboardName" . }}-assets
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with (default .Values.nodeSelector .Values.dashboard.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
