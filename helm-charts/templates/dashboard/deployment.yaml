{{- if .Values.dashboard.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decision-engine.dashboardName" . }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.dashboard.metadata.labels.component }}
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "decision-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.dashboard.metadata.labels.component }}
  template:
    metadata:
      annotations:
        # nginx reads the config only at startup.
        checksum/nginx-config: {{ include (print $.Template.BasePath "/dashboard/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "decision-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.dashboard.metadata.labels.component }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decision-engine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # The release tarball ships website/dist already built, so this only unpacks it.
        - name: fetch-dashboard
          image: "{{ .Values.dashboard.assets.image.repository }}:{{ .Values.dashboard.assets.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.assets.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |-
              set -e
              MARKER=/usr/share/nginx/html/.dashboard-version
              if [ "$FORCE_REFRESH" != "true" ] && [ -f "$MARKER" ] && [ "$(cat $MARKER)" = "$SOURCE_REF" ]; then
                echo "Assets for $SOURCE_REF are already present."
                exit 0
              fi
              echo "Fetching $SOURCE_URL"
              rm -rf /tmp/src && mkdir -p /tmp/src
              wget -qO /tmp/src.tgz "$SOURCE_URL"
              tar -xzf /tmp/src.tgz -C /tmp/src --strip-components=1
              if [ ! -d /tmp/src/website/dist ]; then
                echo "No website/dist in $SOURCE_REF - the tag must carry the built assets." >&2
                exit 1
              fi
              rm -rf /usr/share/nginx/html/* /usr/share/nginx/html/.dashboard-version
              cp -r /tmp/src/website/dist/. /usr/share/nginx/html/
              echo "$SOURCE_REF" > "$MARKER"
              echo "Done"
          env:
            - name: SOURCE_REF
              value: {{ include "decision-engine.dashboardSourceRef" . | quote }}
            - name: SOURCE_URL
              value: {{ include "decision-engine.dashboardSourceUrl" . | quote }}
            - name: FORCE_REFRESH
              value: {{ .Values.dashboard.assets.forceRefresh | quote }}
          resources:
            {{- toYaml .Values.dashboard.assets.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      containers:
        - name: dashboard
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.dashboard.nginx.repository }}:{{ .Values.dashboard.nginx.tag }}"
          imagePullPolicy: {{ .Values.dashboard.nginx.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dashboard.containerPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.dashboard.basePath }}
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "decision-engine.dashboardName" . }}-nginx
        - name: html
          emptyDir: {}
      {{- with (default .Values.nodeSelector .Values.dashboard.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
