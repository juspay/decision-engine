apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "decision-engine.fullname" . }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.decisionEngine.metadata.labels.component }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "decision-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ .Values.decisionEngine.metadata.labels.component }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "decision-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ .Values.decisionEngine.metadata.labels.component }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decision-engine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        {{- if .Values.decisionEngine.usePostgreSQL }}
        - name: wait-for-postgresql
          image: "{{ .Values.initContainers.busybox.repository }}:{{ .Values.initContainers.busybox.tag }}"
          imagePullPolicy: {{ .Values.initContainers.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ include "decision-engine.postgresqlHost" . }} 5432; do echo waiting for postgresql; sleep 2; done;']
        {{- end }}
        {{- if .Values.decisionEngine.useRedis }}
        - name: wait-for-redis
          image: "{{ .Values.initContainers.busybox.repository }}:{{ .Values.initContainers.busybox.tag }}"
          imagePullPolicy: {{ .Values.initContainers.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ include "decision-engine.redisHost" . }} 6379; do echo waiting for redis; sleep 2; done;']
        {{- end }}
        - name: wait-for-groovy-runner
          image: "{{ .Values.initContainers.busybox.repository }}:{{ .Values.initContainers.busybox.tag }}"
          imagePullPolicy: {{ .Values.initContainers.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ include "decision-engine.groovyRunnerName" . }} {{ .Values.groovyRunner.service.port }}; do echo waiting for groovy-runner; sleep 2; done;']
        {{- if .Values.decisionEngine.useMySQL }}
        - name: wait-for-mysql
          image: "{{ .Values.initContainers.busybox.repository }}:{{ .Values.initContainers.busybox.tag }}"
          imagePullPolicy: {{ .Values.initContainers.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ include "decision-engine.mysqlHost" . }} 3306; do echo waiting for mysql; sleep 2; done;']
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.version | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            {{- range .Values.service.ports }}
            - name: {{ .name }}
              containerPort: {{ .targetPort }}
              protocol: {{ .protocol | default "TCP" }}
            {{- end }}
          # The ConfigMap carries the full upstream config for this appVersion. Only the values that
          # differ per deployment are overridden here, through DECISION_ENGINE__<section>__<key>
          # (src/config.rs: prefix DECISION_ENGINE, separator __).
          env:
            - name: GROOVY_RUNNER_HOST
              value: "{{ include "decision-engine.groovyRunnerName" . }}:{{ .Values.groovyRunner.service.port }}"
            - name: DECISION_ENGINE__SERVER__HOST
              value: {{ .Values.decisionEngine.server.host | quote }}
            - name: DECISION_ENGINE__SERVER__PORT
              value: {{ .Values.decisionEngine.server.port | quote }}
            - name: DECISION_ENGINE__METRICS__HOST
              value: {{ .Values.decisionEngine.metrics.host | quote }}
            - name: DECISION_ENGINE__METRICS__PORT
              value: {{ .Values.decisionEngine.metrics.port | quote }}
            - name: DECISION_ENGINE__LOG__CONSOLE__LEVEL
              value: {{ .Values.decisionEngine.logging.level | quote }}
            - name: DECISION_ENGINE__LOG__CONSOLE__LOG_FORMAT
              value: {{ .Values.decisionEngine.logging.format | quote }}
            - name: DECISION_ENGINE__LIMIT__REQUEST_COUNT
              value: {{ .Values.decisionEngine.rateLimit.requestCount | quote }}
            - name: DECISION_ENGINE__LIMIT__DURATION
              value: {{ .Values.decisionEngine.rateLimit.duration | quote }}
            - name: DECISION_ENGINE__CACHE__TTI
              value: {{ .Values.decisionEngine.cache.tti | quote }}
            - name: DECISION_ENGINE__CACHE__MAX_CAPACITY
              value: {{ .Values.decisionEngine.cache.maxCapacity | quote }}
            {{- if .Values.decisionEngine.usePostgreSQL }}
            - name: DECISION_ENGINE__PG_DATABASE__PG_HOST
              value: {{ include "decision-engine.postgresqlHost" . | quote }}
            - name: DECISION_ENGINE__PG_DATABASE__PG_PORT
              value: "5432"
            - name: DECISION_ENGINE__PG_DATABASE__PG_USERNAME
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: DECISION_ENGINE__PG_DATABASE__PG_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
            - name: DECISION_ENGINE__PG_DATABASE__PG_DBNAME
              value: {{ .Values.postgresql.auth.database | quote }}
            {{- end }}
            {{- if .Values.decisionEngine.useMySQL }}
            - name: DECISION_ENGINE__DATABASE__HOST
              value: {{ include "decision-engine.mysqlHost" . | quote }}
            - name: DECISION_ENGINE__DATABASE__PORT
              value: "3306"
            - name: DECISION_ENGINE__DATABASE__USERNAME
              value: {{ .Values.mysql.auth.username | default "root" | quote }}
            - name: DECISION_ENGINE__DATABASE__PASSWORD
              value: {{ .Values.mysql.auth.rootPassword | default "root" | quote }}
            - name: DECISION_ENGINE__DATABASE__DBNAME
              value: {{ .Values.mysql.auth.database | default "jdb" | quote }}
            {{- end }}
            {{- if .Values.decisionEngine.useRedis }}
            - name: DECISION_ENGINE__REDIS__HOST
              value: {{ include "decision-engine.redisHost" . | quote }}
            - name: DECISION_ENGINE__REDIS__PORT
              value: "6379"
            {{- end }}
            {{- if ne .Values.decisionEngine.secrets.secretsManager "no_encryption" }}
            - name: DECISION_ENGINE__SECRETS_MANAGEMENT__SECRETS_MANAGER
              value: {{ .Values.decisionEngine.secrets.secretsManager | quote }}
            - name: DECISION_ENGINE__SECRETS_MANAGEMENT__AWS_KMS__KEY_ID
              value: {{ .Values.decisionEngine.secrets.awsKms.keyId | quote }}
            - name: DECISION_ENGINE__SECRETS_MANAGEMENT__AWS_KMS__REGION
              value: {{ .Values.decisionEngine.secrets.awsKms.region | quote }}
            {{- end }}
            - name: DECISION_ENGINE__API_CLIENT__CLIENT_IDLE_TIMEOUT
              value: {{ .Values.decisionEngine.apiClient.clientIdleTimeout | quote }}
            - name: DECISION_ENGINE__API_CLIENT__POOL_MAX_IDLE_PER_HOST
              value: {{ .Values.decisionEngine.apiClient.poolMaxIdlePerHost | quote }}
            {{- with .Values.decisionEngine.apiClient.identity }}
            - name: DECISION_ENGINE__API_CLIENT__IDENTITY
              value: {{ . | quote }}
            {{- end }}
            # analytics.kafka.enabled / analytics.clickhouse.enabled are the real switches; there is
            # no top-level `analytics.enabled` field in the config schema.
            - name: DECISION_ENGINE__ANALYTICS__KAFKA__ENABLED
              value: {{ ternary "true" "false" .Values.analytics.enabled | quote }}
            - name: DECISION_ENGINE__ANALYTICS__KAFKA__BROKERS
              value: {{ .Values.analytics.kafka.brokers | quote }}
            - name: DECISION_ENGINE__ANALYTICS__KAFKA__API_TOPIC
              value: {{ .Values.analytics.kafka.apiTopic | quote }}
            - name: DECISION_ENGINE__ANALYTICS__KAFKA__DOMAIN_TOPIC
              value: {{ .Values.analytics.kafka.domainTopic | quote }}
            - name: DECISION_ENGINE__ANALYTICS__CLICKHOUSE__ENABLED
              value: {{ ternary "true" "false" .Values.analytics.enabled | quote }}
            - name: DECISION_ENGINE__ANALYTICS__CLICKHOUSE__URL
              value: {{ printf "http://%s:%v" .Values.analytics.clickhouse.host .Values.analytics.clickhouse.httpPort | quote }}
            - name: DECISION_ENGINE__ANALYTICS__CLICKHOUSE__DATABASE
              value: {{ .Values.analytics.clickhouse.database | quote }}
            - name: DECISION_ENGINE__ANALYTICS__CLICKHOUSE__USER
              value: {{ .Values.analytics.clickhouse.user | quote }}
            - name: DECISION_ENGINE__ANALYTICS__CLICKHOUSE__PASSWORD
              value: {{ .Values.analytics.clickhouse.password | quote }}
          {{- range $name, $value := .Values.extraEnvVars }}
            - name: {{ $name }}
            {{- if and (kindIs "map" $value) $value.valueFrom }}
              valueFrom:
                {{- toYaml $value.valueFrom | nindent 16 }}
            {{- else }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /local/config/development.toml
              subPath: development.toml
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "decision-engine.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
