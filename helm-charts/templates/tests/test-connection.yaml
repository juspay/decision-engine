apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "decision-engine.fullname" . }}-test-connection"
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: "{{ .Values.initContainers.busybox.repository }}:{{ .Values.initContainers.busybox.tag }}"
      command: ['wget']
      args:
        - '-q'
        - '-O-'
        - '{{ include "decision-engine.fullname" . }}:{{ (first .Values.service.ports).port }}/health'
