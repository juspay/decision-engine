{{- if and .Values.dbMigration.enabled .Values.dbMigration.postgresql.enabled .Values.decisionEngine.usePostgreSQL -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "decision-engine.postgresqlMigrationName" . }}
  labels:
    {{- include "decision-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: pg-migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "decision-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: pg-migration
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "decision-engine.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.enabled }}
      initContainers:
        - name: wait-for-postgresql
          image: "{{ .Values.initContainers.busybox.repository }}:{{ .Values.initContainers.busybox.tag }}"
          imagePullPolicy: {{ .Values.initContainers.busybox.pullPolicy }}
          command: ['sh', '-c', 'until nc -z {{ include "decision-engine.postgresqlHost" . }} {{ .Values.postgresql.port }}; do echo waiting for postgresql; sleep 2; done;']
      {{- end }}
      containers:
        - name: migration
          image: "{{ .Values.dbMigration.postgresql.image.registry }}/{{ .Values.dbMigration.postgresql.image.repository }}"
          imagePullPolicy: {{ .Values.dbMigration.postgresql.image.pullPolicy }}
          command: ['/bin/bash', '-c']
          #language=bash
          args:
            - |-
              set -eo pipefail
              apt-get update -qq
              apt-get install -y -qq curl tar xz-utils libpq5 ca-certificates
              # diesel_cli comes from the upstream installer rather than `cargo install`, which
              # would compile it from source on every run (minutes) and needs a Rust toolchain.
              curl --proto '=https' --tlsv1.2 -LsSf "$DIESEL_INSTALLER" | sh
              export PATH="$HOME/.cargo/bin:$PATH"
              diesel --version
              curl -fsSL --retry 3 --retry-delay 5 -o decision-engine.tar.gz "$SOURCE_URL"
              tar -xzf decision-engine.tar.gz --transform 's|[^/]*/|decision-engine/|'
              cd decision-engine
              diesel migration \
                --database-url "postgres://$POSTGRES_USER:$POSTGRES_PASSWORD@$POSTGRES_HOST:$POSTGRES_PORT/$DBNAME" \
                run \
                --migration-dir "$MIGRATION_DIR" \
                --config-file diesel_pg.toml
              echo "Completed decision engine database migration"
          env:
            - name: DIESEL_INSTALLER
              value: {{ .Values.dbMigration.postgresql.dieselInstaller | quote }}
            - name: SOURCE_URL
              value: {{ include "decision-engine.migrationSourceUrl" . | quote }}
            - name: MIGRATION_DIR
              value: {{ .Values.dbMigration.postgresql.migrations.path | quote }}
            - name: POSTGRES_HOST
              value: {{ include "decision-engine.postgresqlHost" . | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgresql.port | quote }}
            - name: DBNAME
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password | quote }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
