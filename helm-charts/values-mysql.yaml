# MySQL profile. The published image is the PostgreSQL build and the MySQL path applies a fixed
# list of SQL files rather than the Diesel migration history, so treat this as legacy.
decisionEngine:
  useMySQL: true
  usePostgreSQL: false
  useRedis: true

mysql:
  enabled: true
  auth:
    rootPassword: "root"
    database: "jdb"
  primary:
    persistence:
      enabled: true
      size: 8Gi

postgresql:
  enabled: false

dbMigration:
  enabled: true
  postgresql:
    enabled: false
  mysql:
    enabled: true
