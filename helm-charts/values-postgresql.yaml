# PostgreSQL profile. Matches the chart defaults, kept as an explicit example.
decisionEngine:
  useMySQL: false
  usePostgreSQL: true
  useRedis: true

postgresql:
  enabled: true
  auth:
    username: "db_user"
    password: "db_pass"
    database: "decision_engine_db"

dbMigration:
  enabled: true
  postgresql:
    enabled: true
