# -- Number of Decision Engine replicas
replicaCount: 1

image:
  # -- Decision Engine image repository. The `/postgres` variant is built with the postgres feature
  repository: ghcr.io/juspay/decision-engine/postgres
  # -- Image pull policy
  pullPolicy: Always
  # -- Image tag. Also used as the git tag the migration Job pulls migrations from, so keep it on a
  # released `vX.Y.Z` tag - the moving `v1.4` image tag has no matching git tag to download
  version: "v1.4.35"

# -- Image pull secrets for private registries
imagePullSecrets: []
# -- Override the chart name used in resource names
nameOverride: ""
# -- Override the fully qualified name of the released resources
fullnameOverride: ""

serviceAccount:
  # -- Create a service account for the Decision Engine pods
  create: true
  # -- Annotations to add to the service account
  annotations: {}
  # -- Name of the service account to use. Generated from the fullname when empty
  name: ""

# -- Annotations added to the Decision Engine pods
podAnnotations: {}

# -- Pod-level security context
podSecurityContext: {}
  # fsGroup: 2000

initContainers:
  # -- Run the wait-for-dependency init containers
  enabled: true
  busybox:
    # -- Image used by the wait-for-dependency init containers
    repository: public.ecr.aws/docker/library/busybox
    # -- Busybox image tag. Must exist on the registry above: the ECR public mirror carries 1.32
    # and newer, so the older tags from Docker Hub fail to pull
    tag: "1.37"
    # -- Busybox image pull policy
    pullPolicy: IfNotPresent

# -- Container-level security context
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  # -- Service type
  type: ClusterIP
  # -- Service ports. `http` carries the API, `metrics` the Prometheus endpoint
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP

ingress:
  # -- Create an Ingress for the Decision Engine API
  enabled: false
  # -- Ingress class name
  className: ""
  # -- Ingress annotations
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # -- Ingress hosts
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # -- Ingress TLS configuration
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# -- Resource requests and limits for the Decision Engine container
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# -- Node selector for the Decision Engine pods
nodeSelector: {}

# -- Tolerations for the Decision Engine pods
tolerations: []

# -- Affinity rules for the Decision Engine pods
affinity: {}

# Where the migration Job and the dashboard build fetch the source tarball from. Point `repoUrl` at
# a mirror when the cluster cannot reach github.com; override a `sourceUrl` below for a mirror that
# does not serve GitHub-style `archive/refs/<kind>/<ref>.tar.gz` paths.
source:
  # -- Base URL the source tarball is fetched from
  repoUrl: https://github.com/juspay/decision-engine

# Decision Engine application configuration. Rendered into the `development.toml` the container reads.
decisionEngine:
  # -- Use MySQL as the application database
  useMySQL: false
  # -- Use PostgreSQL as the application database
  usePostgreSQL: true
  # -- Connect to Redis
  useRedis: true
  logging:
    # -- Console log level
    level: "DEBUG"
    # -- Console log format
    format: "default"
  server:
    # -- API bind address. Must stay 0.0.0.0 for the kubelet probes to reach the container
    host: "0.0.0.0"
    # -- API port
    port: 8080
  metrics:
    # -- Metrics bind address
    host: "0.0.0.0"
    # -- Metrics port
    port: 9090
  rateLimit:
    # -- Requests allowed per window
    requestCount: 1
    # -- Rate limit window in seconds
    duration: 60
  cache:
    # -- Cache time-to-idle in seconds
    tti: 7200
    # -- Maximum number of cached entries
    maxCapacity: 5000
  secrets:
    # -- Open router private key
    openRouterPrivateKey: ""
    # -- Secrets manager backend: `no_encryption` or `aws_kms`
    secretsManager: "no_encryption"
    awsKms:
      # -- AWS KMS key id
      keyId: "us-west-2"
      # -- AWS KMS region
      region: "abc"
  apiClient:
    # -- Outbound client idle timeout in seconds
    clientIdleTimeout: 90
    # -- Maximum idle connections kept per host
    poolMaxIdlePerHost: 10
    # -- Client identity
    identity: ""
  metadata:
    labels:
      # -- Value of the `app.kubernetes.io/component` label on Decision Engine resources
      component: decision-engine

analytics:
  # -- Emit analytics events to Kafka and ClickHouse. The server must start after Kafka is reachable
  enabled: false
  kafka:
    # -- Kafka bootstrap servers
    brokers: "kafka:19092"
    # -- Topic for API events
    apiTopic: "decision-engine.analytics.api.v1"
    # -- Topic for domain events
    domainTopic: "decision-engine.analytics.domain.v1"
  clickhouse:
    # -- ClickHouse host
    host: "clickhouse"
    # -- ClickHouse HTTP port
    httpPort: 8123
    # -- ClickHouse native port
    nativePort: 9000
    # -- ClickHouse database
    database: "decision_engine_analytics"
    # -- ClickHouse user
    user: "decision_engine"
    # -- ClickHouse password
    password: "decision_engine"
    # -- Broker list the ClickHouse Kafka engine tables consume from
    kafkaBrokerList: "kafka:19092"
    # -- Consumer group for the API events table
    apiConsumerGroup: "decision-engine-analytics-api-v1"
    # -- Consumer group for the domain events table
    domainConsumerGroup: "decision-engine-analytics-domain-v1"
    bootstrap:
      # -- Run the Job that creates the analytics database, tables and materialized views
      enabled: false
      image:
        # -- Image carrying `clickhouse-client`
        repository: "clickhouse/clickhouse-server"
        # -- Tag of the bootstrap image
        tag: "26.1"
        # -- Pull policy of the bootstrap image
        pullPolicy: "IfNotPresent"

# MySQL sub-chart, used when `decisionEngine.useMySQL` is true.
mysql:
  # -- Deploy the Bitnami MySQL sub-chart
  enabled: false
  # -- Existing MySQL host, used when the sub-chart is disabled
  hostname: ""
  # -- MySQL port
  port: 3306
  image:
    # -- Bitnami's free images now live under `bitnamilegacy`
    repository: bitnamilegacy/mysql
    # -- MySQL image tag
    tag: 8.0.35-debian-11-r3
  auth:
    # -- MySQL root password
    rootPassword: "root"
    # -- MySQL database
    database: "jdb"
  primary:
    persistence:
      # -- Persist MySQL data
      enabled: true
      # -- MySQL volume size
      size: 8Gi

# PostgreSQL sub-chart, used when `decisionEngine.usePostgreSQL` is true.
# Set `enabled: false` and point `hostname` at an existing server when running inside a stack that
# already has one - two enabled sub-charts in the same release would both claim `<release>-postgresql`.
postgresql:
  # -- Deploy the Bitnami PostgreSQL sub-chart
  enabled: true
  # -- Existing PostgreSQL host, used when the sub-chart is disabled
  hostname: ""
  # -- PostgreSQL port
  port: 5432
  image:
    # -- Bitnami's free images now live under `bitnamilegacy`
    repository: bitnamilegacy/postgresql
    # -- PostgreSQL image tag
    tag: 16.1.0-debian-11-r18
  auth:
    # -- PostgreSQL username
    username: "db_user"
    # -- PostgreSQL password
    password: "db_pass"
    # -- PostgreSQL database
    database: "decision_engine_db"
  primary:
    persistence:
      # -- Persist PostgreSQL data
      enabled: true
      # -- PostgreSQL volume size
      size: 8Gi

# Redis sub-chart. Same collision caveat as postgresql above.
redis:
  # -- Deploy the Bitnami Redis sub-chart
  enabled: true
  # -- Existing Redis host, used when the sub-chart is disabled
  hostname: ""
  # -- Redis port
  port: 6379
  image:
    # -- Bitnami's free images now live under `bitnamilegacy`
    repository: bitnamilegacy/redis
    # -- Redis image tag
    tag: 7.2.3-debian-11-r2
  auth:
    # -- Require a password for Redis
    enabled: false
  master:
    persistence:
      # -- Persist Redis master data
      enabled: true
      # -- Redis master volume size
      size: 8Gi
  replica:
    # -- Number of Redis replicas
    replicaCount: 1
    persistence:
      # -- Persist Redis replica data
      enabled: true
      # -- Redis replica volume size
      size: 8Gi

groovyRunner:
  # -- Deploy the Groovy rule runner. The Decision Engine waits for it before starting
  enabled: true
  image:
    # -- Groovy runner image repository
    repository: "ghcr.io/juspay/decision-engine/groovy-runner"
    # -- Groovy runner image tag
    version: "v1.4.35"
    # -- Groovy runner image pull policy
    pullPolicy: "Always"
  service:
    # -- Groovy runner service port
    port: 8085
  # -- Resource requests and limits for the Groovy runner
  resources: {}
  # -- Node selector for the Groovy runner. Falls back to the chart-wide `nodeSelector`.
  # Pin an architecture here if the published image is single-arch on your registry
  nodeSelector: {}
  healthcheck:
    # -- Add liveness and readiness probes to the Groovy runner
    enabled: true
    # -- Health endpoint path
    path: "/health"
    # -- Delay before the first probe
    initialDelaySeconds: 10
    # -- Probe interval
    periodSeconds: 5
    # -- Probe timeout
    timeoutSeconds: 5
    # -- Failures tolerated before the container is restarted
    failureThreshold: 5
  metadata:
    labels:
      # -- Value of the `app.kubernetes.io/component` label on Groovy runner resources
      component: groovy-runner

# The `website/` bundle, built in an init container and served by nginx, which also proxies the API
# prefix so both answer on one origin.
dashboard:
  # -- Deploy the dashboard
  enabled: false
  # -- Number of replicas. Keep at 1 with a ReadWriteOnce assets volume
  replicaCount: 1
  build:
    image:
      # -- Image the build runs in. Needs node, npm, wget and tar
      repository: node
      # -- Build image tag
      tag: 20-alpine
      # -- Build image pull policy
      pullPolicy: IfNotPresent
    # -- Git reference kind the source is fetched from: `tags` or `heads`
    refs: tags
    # -- Git reference to build from. Defaults to `image.version`
    sourceRef: ""
    # -- Full tarball URL. Defaults to `source.repoUrl` plus the reference above
    sourceUrl: ""
    # -- Rebuild even when the volume already holds those assets
    forceBuild: false
    # -- Resources for the build container
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        memory: 2Gi
    persistence:
      # -- Keep assets on a volume so a replaced pod skips the build
      enabled: false
      # -- Access modes for the assets volume
      accessModes:
        - ReadWriteOnce
      # -- Storage class. Empty uses the cluster default
      storageClass: ""
      # -- Size of the assets volume
      size: 1Gi
  nginx:
    # -- Image serving the built assets
    repository: nginx
    # -- nginx image tag
    tag: alpine
    # -- nginx image pull policy
    pullPolicy: IfNotPresent
  service:
    # -- Dashboard service type
    type: ClusterIP
    # -- Dashboard service port
    port: 80
  # -- Port nginx listens on inside the container
  containerPort: 8080
  # -- Path the bundle is served from. Baked in at build time by website/vite.config.ts
  basePath: /decision-engine/
  # -- Path prefix proxied to the Decision Engine. Must match `website/src/lib/api.ts`
  apiBasePath: /decision-engine/api
  # -- Upstream read timeout for proxied API calls
  proxyReadTimeout: 60s
  ingress:
    # -- Add a `basePath` rule to the chart's Ingress. API calls ride through it too
    enabled: true
  # -- Resource requests and limits for the nginx container
  resources: {}
  # -- Node selector. Falls back to the chart-wide `nodeSelector`
  nodeSelector: {}
  metadata:
    labels:
      # -- Value of the `app.kubernetes.io/component` label
      component: dashboard

dbMigration:
  # -- Run the schema migration Job as a post-install/post-upgrade hook
  enabled: true
  # -- Git reference kind the migrations are fetched from: `tags` or `heads`
  refs: tags
  # -- Git reference to fetch migrations from. Defaults to `image.version`
  version: ""
  postgresql:
    # -- Run the PostgreSQL migration Job
    enabled: true
    image:
      # -- Registry of the migration base image
      registry: docker.io
      # -- Base image for the migration Job. It needs `bash`, `apt-get` and network access: the Job
      # installs diesel_cli into it, as the hyperswitch-app chart does
      repository: debian:trixie-slim
      # -- Migration image pull policy
      pullPolicy: "IfNotPresent"
    migrations:
      # -- Migration directory inside the source tree
      path: "migrations_pg"
    # -- Installer used to place diesel_cli in the migration Job. Pin a release tag instead of
    # `latest` if you need the CLI version to be reproducible
    dieselInstaller: https://github.com/diesel-rs/diesel/releases/latest/download/diesel_cli-installer.sh
  mysql:
    # -- Run the MySQL migration Job
    enabled: false
    image:
      # -- Registry of the MySQL migration base image
      registry: docker.io
      # -- Base image for the MySQL migration Job
      repository: debian:stable-slim
      # -- Migration image pull policy
      pullPolicy: IfNotPresent
    # -- SQL files applied by the MySQL migration Job, in order
    scriptUrls:
      - https://raw.githubusercontent.com/juspay/decision-engine/431b1b2/migrations/00000000000000_diesel_initial_setup/up.sql
      - https://raw.githubusercontent.com/juspay/decision-engine/431b1b2/migrations/2025-04-23-103603_add_routing_algorithm_mapper_table/up.sql
      - https://raw.githubusercontent.com/juspay/decision-engine/431b1b2/migrations/2025-05-09-112540_add_metadata_to_routing_algorithm/up.sql

# -- Extra environment variables for the Decision Engine container. Values may be plain or a
# `valueFrom` reference, e.g. `DECISION_ENGINE__PG_DATABASE__PG_PASSWORD: {valueFrom: {secretKeyRef: ...}}`
extraEnvVars: {}
  # Simple value example:
  # MY_VAR: "my-value"
  # Secret reference example:
  # DB_PASSWORD:
  #   valueFrom:
  #     secretKeyRef:
  #       name: decision-engine-secrets
  #       key: DECISION_ENGINE__PG_DATABASE__PG_PASSWORD

istio:
  # -- Enable Istio resources
  enabled: false
  virtualService:
    # -- Create a VirtualService
    enabled: false
    # -- Hosts for the VirtualService
    hosts: []
    # -- Gateways for the VirtualService
    gateways: []
    # -- HTTP routing rules. The route destination is set to the Decision Engine service
    http: []
    # Example configuration:
    # http:
    #   - name: "decision-engine-routes"
    #     match:
    #       - uri:
    #           prefix: /
    #     weight: 100
    #     timeout: 30s
    #     retries:
    #       attempts: 3
    #       perTryTimeout: 10s
  destinationRule:
    # -- Create a DestinationRule
    enabled: false
    # -- Traffic policy for the DestinationRule
    trafficPolicy: {}
    # Example traffic policy:
    # trafficPolicy:
    #   loadBalancer:
    #     simple: ROUND_ROBIN
    #   connectionPool:
    #     tcp:
    #       maxConnections: 50
    #       connectTimeout: 30s
