replicaCount: 1

image:
  repository: ghcr.io/juspay/decision-engine/postgres
  pullPolicy: Always
  # Also used as the git tag for migrations; use a released tag.
  version: "v1.4.35"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

initContainers:
  enabled: true
  busybox:
    repository: public.ecr.aws/docker/library/busybox
    tag: "1.37"
    pullPolicy: IfNotPresent

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Where the migration Job and the dashboard assets are fetched from. Point `repoUrl` at
# a mirror when the cluster cannot reach github.com; override a `sourceUrl` below for a mirror that
# does not serve GitHub-style `archive/refs/<kind>/<ref>.tar.gz` paths.
source:
  repoUrl: https://github.com/juspay/decision-engine

decisionEngine:
  useMySQL: false
  usePostgreSQL: true
  useRedis: true
  logging:
    level: "DEBUG"
    format: "default"
  telemetry:
    metricsEnabled: false
    ignoreErrors: true
    otelExporterOtlpEndpoint: "http://otel-collector:4317"
    # Milliseconds per export request.
    otelExporterOtlpTimeout: 10000
  server:
    host: "0.0.0.0"
    port: 8080
  rateLimit:
    requestCount: 1
    duration: 60
  cache:
    tti: 7200
    maxCapacity: 5000
  secrets:
    openRouterPrivateKey: ""
    secretsManager: "no_encryption"
    awsKms:
      keyId: "us-west-2"
      region: "abc"
  apiClient:
    clientIdleTimeout: 90
    poolMaxIdlePerHost: 10
    identity: ""
  metadata:
    labels:
      component: decision-engine

analytics:
  enabled: false
  kafka:
    brokers: "kafka:19092"
    apiTopic: "decision-engine.analytics.api.v1"
    domainTopic: "decision-engine.analytics.domain.v1"
  clickhouse:
    host: "clickhouse"
    httpPort: 8123
    nativePort: 9000
    database: "decision_engine_analytics"
    user: "decision_engine"
    password: "decision_engine"
    kafkaBrokerList: "kafka:19092"
    apiConsumerGroup: "decision-engine-analytics-api-v1"
    domainConsumerGroup: "decision-engine-analytics-domain-v1"
    bootstrap:
      enabled: false
      image:
        repository: "clickhouse/clickhouse-server"
        tag: "26.1"
        pullPolicy: "IfNotPresent"

mysql:
  enabled: false
  hostname: ""
  port: 3306
  image:
    repository: bitnamilegacy/mysql
    tag: 8.0.35-debian-11-r3
  auth:
    rootPassword: "root"
    database: "jdb"
  primary:
    persistence:
      enabled: true
      size: 8Gi

# PostgreSQL sub-chart, used when `decisionEngine.usePostgreSQL` is true.
# Set `enabled: false` and point `hostname` at an existing server when running inside a stack that
# already has one - two enabled sub-charts in the same release would both claim `<release>-postgresql`.
postgresql:
  enabled: true
  hostname: ""
  port: 5432
  image:
    repository: bitnamilegacy/postgresql
    tag: 16.1.0-debian-11-r18
  auth:
    username: "db_user"
    password: "db_pass"
    database: "decision_engine_db"
  primary:
    persistence:
      enabled: true
      size: 8Gi

# Redis sub-chart. Same collision caveat as postgresql above.
redis:
  enabled: true
  hostname: ""
  port: 6379
  image:
    repository: bitnamilegacy/redis
    tag: 7.2.3-debian-11-r2
  auth:
    enabled: false
  master:
    persistence:
      enabled: true
      size: 8Gi
  replica:
    replicaCount: 1
    persistence:
      enabled: true
      size: 8Gi

groovyRunner:
  enabled: true
  image:
    repository: "ghcr.io/juspay/decision-engine/groovy-runner"
    version: "v1.4.35"
    pullPolicy: "Always"
  service:
    port: 8085
  resources: {}
  nodeSelector: {}
  healthcheck:
    enabled: true
    path: "/health"
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 5
  metadata:
    labels:
      component: groovy-runner

# The dashboard: `website/dist`, which ships already built in the release tarball. An init container
# unpacks it into a volume and nginx serves it, proxying the API prefix to the Decision Engine so
# both answer on one origin (the application has no CORS layer). Nothing is built or pulled here.
dashboard:
  enabled: false
  replicaCount: 1
  assets:
    image:
      repository: public.ecr.aws/docker/library/alpine
      tag: "3.20"
      pullPolicy: IfNotPresent
    refs: tags
    sourceRef: ""
    sourceUrl: ""
    forceRefresh: false
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi
  nginx:
    repository: nginx
    tag: alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  containerPort: 8080
  # -- Path the bundle is served from. Baked in at build time by website/vite.config.ts
  basePath: /decision-engine/
  # -- Path prefix proxied to the Decision Engine. Must match `website/src/lib/api.ts`
  apiBasePath: /decision-engine/api
  proxyReadTimeout: 60s
  ingress:
    enabled: true
  resources: {}
  nodeSelector: {}
  metadata:
    labels:
      component: dashboard

dbMigration:
  enabled: true
  refs: tags
  version: ""
  postgresql:
    enabled: true
    image:
      registry: docker.io
      # -- Base image for the migration Job. It needs `bash`, `apt-get` and network access: the Job
      # installs diesel_cli into it, as the hyperswitch-app chart does
      repository: debian:trixie-slim
      pullPolicy: "IfNotPresent"
    migrations:
      path: "migrations_pg"
    # -- Installer used to place diesel_cli in the migration Job. Pin a release tag instead of
    # `latest` if you need the CLI version to be reproducible
    dieselInstaller: https://github.com/diesel-rs/diesel/releases/latest/download/diesel_cli-installer.sh
  mysql:
    enabled: false
    image:
      registry: docker.io
      repository: debian:stable-slim
      pullPolicy: IfNotPresent
    scriptUrls:
      - https://raw.githubusercontent.com/juspay/decision-engine/431b1b2/migrations/00000000000000_diesel_initial_setup/up.sql
      - https://raw.githubusercontent.com/juspay/decision-engine/431b1b2/migrations/2025-04-23-103603_add_routing_algorithm_mapper_table/up.sql
      - https://raw.githubusercontent.com/juspay/decision-engine/431b1b2/migrations/2025-05-09-112540_add_metadata_to_routing_algorithm/up.sql

routingConfig:
  enabled: false
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  command: ["bash", "run_setup.sh"]
  configVolume:
    enabled: false
    mountPath: /app

# Values may be plain or a `valueFrom` reference (e.g. a Secret key).
extraEnvVars: {}
  # Simple value example:
  # MY_VAR: "my-value"
  # Secret reference example:
  # DB_PASSWORD:
  #   valueFrom:
  #     secretKeyRef:
  #       name: decision-engine-secrets
  #       key: DECISION_ENGINE__PG_DATABASE__PG_PASSWORD

istio:
  enabled: false
  virtualService:
    enabled: false
    hosts: []
    gateways: []
    http: []
    # Example configuration:
    # http:
    #   - name: "decision-engine-routes"
    #     match:
    #       - uri:
    #           prefix: /
    #     weight: 100
    #     timeout: 30s
    #     retries:
    #       attempts: 3
    #       perTryTimeout: 10s
  destinationRule:
    enabled: false
    trafficPolicy: {}
    # Example traffic policy:
    # trafficPolicy:
    #   loadBalancer:
    #     simple: ROUND_ROBIN
    #   connectionPool:
    #     tcp:
    #       maxConnections: 50
    #       connectTimeout: 30s
